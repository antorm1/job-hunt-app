<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobHunt — Remote Jobs Aggregator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --green: #22c55e;
            --orange: #f97316;
            --pink: #ec4899;
            --cyan: #06b6d4;
            --radius: 12px;
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.3rem;
            font-weight: 800;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--pink));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .theme-toggle {
            background: var(--surface-hover);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            font-size: 1.1rem;
            color: var(--text);
            transition: all 0.2s;
        }

        .theme-toggle:hover { border-color: var(--accent); }

        .stats-bar {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .stat { display: flex; align-items: center; gap: 0.3rem; }
        .stat-dot { width: 7px; height: 7px; border-radius: 50%; }

        /* Search */
        .search-row {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem 0;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.3rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus { border-color: var(--accent); }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 0.7rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
        }

        .sort-select {
            padding: 0.6rem 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.825rem;
            outline: none;
            cursor: pointer;
        }

        .sort-select option { background: var(--surface); }

        .btn {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.825rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn:hover { border-color: var(--accent); }
        .btn-accent { background: var(--accent); border-color: var(--accent); color: white; }
        .btn-accent:hover { background: var(--accent-light); }

        /* Main layout */
        .main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.25rem 2rem;
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 1.5rem;
        }

        /* Sidebar */
        .sidebar {
            position: sticky;
            top: 90px;
            height: fit-content;
        }

        .sidebar h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            padding: 0 0.5rem;
        }

        .category-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            width: 100%;
            padding: 0.5rem 0.5rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.825rem;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
        }

        .category-btn:hover { background: var(--surface); color: var(--text); }
        .category-btn.active { background: var(--accent); color: white; font-weight: 600; }
        .category-btn .emoji { font-size: 1rem; }

        .source-filters {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .source-btn {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            width: 100%;
            padding: 0.4rem 0.5rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.78rem;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
        }

        .source-btn:hover { background: var(--surface); color: var(--text); }
        .source-btn.active { background: var(--surface-hover); color: var(--text); font-weight: 500; }
        .source-btn .dot { width: 6px; height: 6px; border-radius: 50%; }

        /* Tab bar */
        .tab-bar {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 0.5rem 1rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

        /* Jobs */
        .jobs-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .jobs-header h2 { font-size: 1rem; font-weight: 600; }

        .jobs-count {
            background: var(--surface);
            padding: 0.25rem 0.65rem;
            border-radius: 16px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .jobs-grid { display: grid; gap: 0.6rem; }

        .job-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.15rem;
            transition: all 0.2s;
            cursor: pointer;
            display: block;
            position: relative;
        }

        .job-card:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 2px 12px rgba(99, 102, 241, 0.1);
        }

        .job-card.bookmarked { border-left: 3px solid var(--orange); }

        .bookmark-btn {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: none;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            opacity: 0.4;
            transition: all 0.2s;
            padding: 0.2rem;
        }

        .bookmark-btn:hover, .bookmark-btn.active { opacity: 1; }
        .bookmark-btn.active { color: var(--orange); }

        .job-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.15rem; padding-right: 2rem; }
        .job-company { font-size: 0.85rem; color: var(--accent-light); font-weight: 500; margin-bottom: 0.4rem; }

        .job-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.45;
            margin-bottom: 0.6rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .job-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem;
        }

        .job-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; }
        .tag {
            font-size: 0.68rem;
            padding: 0.15rem 0.45rem;
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-light);
            border-radius: 4px;
        }

        .job-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.75rem;
        }

        .job-source-badge {
            font-size: 0.65rem;
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .badge-remotive { background: rgba(34, 197, 94, 0.15); color: var(--green); }
        .badge-arbeitnow { background: rgba(249, 115, 22, 0.15); color: var(--orange); }
        .badge-remoteok { background: rgba(236, 72, 153, 0.15); color: var(--pink); }
        .badge-unknown { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); }

        /* Load more */
        .load-more {
            text-align: center;
            padding: 1.5rem;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .modal-close {
            background: var(--surface-hover);
            border: none;
            color: var(--text);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-title { font-size: 1.2rem; font-weight: 700; }
        .modal-company { color: var(--accent-light); font-weight: 500; margin-top: 0.2rem; }

        .modal-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1rem 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .modal-description {
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text);
            margin-bottom: 1.25rem;
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--accent);
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 300;
        }

        .toast.show { transform: translateY(0); opacity: 1; }

        /* Loading & Empty */
        .loading { text-align: center; padding: 4rem 2rem; }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.75rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .empty-state .emoji { font-size: 3rem; margin-bottom: 0.75rem; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.78rem;
            border-top: 1px solid var(--border);
            margin-top: 1.5rem;
        }

        .footer a { color: var(--accent-light); text-decoration: none; }

        /* Responsive */
        @media (max-width: 768px) {
            .main { grid-template-columns: 1fr; padding: 1rem; }
            .sidebar {
                position: static;
                display: flex;
                gap: 0.4rem;
                overflow-x: auto;
                padding-bottom: 0.5rem;
            }
            .sidebar h3, .source-filters { display: none; }
            .category-btn { white-space: nowrap; width: auto; }
            .header-inner { flex-direction: column; align-items: stretch; }
            .search-box { max-width: none; }
            .stats-bar { justify-content: center; }
            .search-row { padding: 0.75rem 1rem 0; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-icon">💼</div>
                <span>JobHunt</span>
            </div>
            <div class="header-actions">
                <div class="stats-bar" id="statsBar">
                    <div class="stat"><div class="stat-dot" style="background:var(--green)"></div><span id="statRemotive">—</span></div>
                    <div class="stat"><div class="stat-dot" style="background:var(--orange)"></div><span id="statArbeitnow">—</span></div>
                    <div class="stat"><div class="stat-dot" style="background:var(--pink)"></div><span id="statRemoteOK">—</span></div>
                </div>
                <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
            </div>
        </div>
    </header>

    <div class="search-row">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search jobs, skills, companies...">
        </div>
        <select class="sort-select" id="sortSelect">
            <option value="date">📅 Newest</option>
            <option value="title">🔤 A-Z</option>
            <option value="company">🏢 Company</option>
        </select>
        <button class="btn" id="exportBtn">📥 Export CSV</button>
    </div>

    <main class="main">
        <aside class="sidebar">
            <h3>Categories</h3>
            <div id="categories">
                <button class="category-btn active" data-cat="all"><span class="emoji">🌐</span> All Jobs</button>
                <button class="category-btn" data-cat="software-development"><span class="emoji">💻</span> Software Dev</button>
                <button class="category-btn" data-cat="data-science"><span class="emoji">📊</span> Data Science</button>
                <button class="category-btn" data-cat="design"><span class="emoji">🎨</span> Design</button>
                <button class="category-btn" data-cat="marketing"><span class="emoji">📣</span> Marketing</button>
                <button class="category-btn" data-cat="devops"><span class="emoji">⚙️</span> DevOps</button>
                <button class="category-btn" data-cat="ai-ml"><span class="emoji">🤖</span> AI / ML</button>
                <button class="category-btn" data-cat="data-annotation"><span class="emoji">📝</span> Data Annotation</button>
                <button class="category-btn" data-cat="customer-support"><span class="emoji">🎧</span> Support</button>
            </div>
            <div class="source-filters">
                <h3>Sources</h3>
                <button class="source-btn active" data-source=""><div class="dot" style="background:var(--accent)"></div> All Sources</button>
                <button class="source-btn" data-source="Remotive"><div class="dot" style="background:var(--green)"></div> Remotive</button>
                <button class="source-btn" data-source="Arbeitnow"><div class="dot" style="background:var(--orange)"></div> Arbeitnow</button>
                <button class="source-btn" data-source="RemoteOK"><div class="dot" style="background:var(--pink)"></div> RemoteOK</button>
            </div>
        </aside>

        <section>
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="all">📋 All Jobs</button>
                <button class="tab-btn" data-tab="bookmarks">🔖 Saved (<span id="bookmarkCount">0</span>)</button>
            </div>
            <div class="jobs-header">
                <h2 id="sectionTitle">All Remote Jobs</h2>
                <span class="jobs-count" id="jobsCount">Loading...</span>
            </div>
            <div id="jobsContainer">
                <div class="loading"><div class="spinner"></div><p>Fetching jobs from multiple sources...</p></div>
            </div>
            <div class="load-more" id="loadMore" style="display:none">
                <button class="btn btn-accent" id="loadMoreBtn">Load More Jobs ↓</button>
            </div>
        </section>
    </main>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div>
                    <div class="modal-title" id="modalTitle"></div>
                    <div class="modal-company" id="modalCompany"></div>
                </div>
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-meta" id="modalMeta"></div>
            <div class="modal-description" id="modalDesc"></div>
            <div class="modal-actions">
                <a href="#" target="_blank" id="modalApply" class="btn btn-accent">Apply Now →</a>
                <button class="btn" id="modalBookmark">🔖 Save Job</button>
                <button class="btn" id="modalShare">📋 Copy Link</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <footer class="footer">
        <p>Built by <a href="https://github.com/antorm1" target="_blank">Antorm</a> · 
           Jobs from Remotive, Arbeitnow & RemoteOK · 
           <a href="https://github.com/antorm1/job-hunt-app" target="_blank">View Source</a>
        </p>
    </footer>

    <script>
        const API_URL = "http://localhost:8000/api";
        let currentCategory = "all";
        let currentSource = "";
        let currentSearch = "";
        let currentSort = "date";
        let currentPage = 1;
        let currentTab = "all";
        let allJobs = [];
        let bookmarks = JSON.parse(localStorage.getItem("jobhunt_bookmarks") || "[]");
        const PER_PAGE = 30;

        const categoryNames = {
            "all": "All Remote Jobs", "software-development": "Software Development",
            "data-science": "Data Science", "design": "Design", "marketing": "Marketing",
            "devops": "DevOps", "ai-ml": "AI / ML", "data-annotation": "Data Annotation",
            "customer-support": "Customer Support",
        };

        function badgeClass(source) {
            return { Remotive: "badge-remotive", Arbeitnow: "badge-arbeitnow", RemoteOK: "badge-remoteok" }[source] || "badge-unknown";
        }

        function formatDate(dateStr) {
            if (!dateStr) return "";
            try {
                const d = new Date(dateStr.replace(/-/g, "/"));
                if (isNaN(d)) return "";
                const diff = Math.floor((Date.now() - d) / 86400000);
                if (diff === 0) return "Today";
                if (diff === 1) return "1d ago";
                if (diff < 7) return `${diff}d ago`;
                if (diff < 30) return `${Math.floor(diff / 7)}w ago`;
                return d.toLocaleDateString();
            } catch { return ""; }
        }

        function isBookmarked(id) { return bookmarks.includes(id); }

        function toggleBookmark(id) {
            const idx = bookmarks.indexOf(id);
            if (idx > -1) { bookmarks.splice(idx, 1); showToast("Job removed from saved"); }
            else { bookmarks.push(id); showToast("Job saved 🔖"); }
            localStorage.setItem("jobhunt_bookmarks", JSON.stringify(bookmarks));
            updateBookmarkCount();
            renderJobs(currentTab === "bookmarks" ? allJobs.filter(j => isBookmarked(j.id)) : allJobs);
        }

        function updateBookmarkCount() {
            document.getElementById("bookmarkCount").textContent = bookmarks.length;
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 2500);
        }

        function renderJobs(jobs) {
            const container = document.getElementById("jobsContainer");
            const countEl = document.getElementById("jobsCount");

            if (!jobs || jobs.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="emoji">🔭</div><h3>No jobs found</h3><p>Try a different category or search</p></div>`;
                countEl.textContent = "0 jobs";
                return;
            }

            countEl.textContent = `${jobs.length} jobs`;

            container.innerHTML = `<div class="jobs-grid">` +
                jobs.map(j => `
                    <div class="job-card ${isBookmarked(j.id) ? 'bookmarked' : ''}" onclick="openModal(${JSON.stringify(j).replace(/"/g, '&quot;')})">
                        <button class="bookmark-btn ${isBookmarked(j.id) ? 'active' : ''}" onclick="event.stopPropagation(); toggleBookmark('${j.id}')">${isBookmarked(j.id) ? '🔖' : '📌'}</button>
                        <div class="job-title">${j.title}</div>
                        <div class="job-company">${j.company}</div>
                        <p class="job-desc">${j.description}</p>
                        <div class="job-footer">
                            <div class="job-tags">${(j.tags || []).slice(0, 4).map(t => `<span class="tag">${t}</span>`).join("")}</div>
                            <div class="job-meta">
                                ${j.salary ? `<span>💰 ${j.salary}</span>` : ""}
                                <span>📍 ${j.location || "Remote"}</span>
                                ${j.posted_date ? `<span>📅 ${formatDate(j.posted_date)}</span>` : ""}
                                <span class="job-source-badge ${badgeClass(j.source)}">${j.source}</span>
                            </div>
                        </div>
                    </div>
                `).join("") + `</div>`;
        }

        async function fetchJobs(append = false) {
            if (!append) {
                currentPage = 1;
                document.getElementById("jobsContainer").innerHTML = `<div class="loading"><div class="spinner"></div><p>Fetching jobs...</p></div>`;
            }

            const params = new URLSearchParams();
            if (currentCategory !== "all") params.set("category", currentCategory);
            if (currentSearch) params.set("search", currentSearch);
            if (currentSource) params.set("source", currentSource);
            params.set("sort", currentSort);
            params.set("page", currentPage);
            params.set("per_page", PER_PAGE);

            try {
                const resp = await fetch(`${API_URL}/jobs?${params}`);
                const data = await resp.json();
                if (append) { allJobs = [...allJobs, ...data.jobs]; }
                else { allJobs = data.jobs; }

                const displayJobs = currentTab === "bookmarks" ? allJobs.filter(j => isBookmarked(j.id)) : allJobs;
                renderJobs(displayJobs);

                document.getElementById("loadMore").style.display = data.has_more ? "block" : "none";
            } catch (err) {
                document.getElementById("jobsContainer").innerHTML = `
                    <div class="empty-state"><div class="emoji">⚠️</div><h3>Could not connect</h3><p>Start backend: <code>cd backend && python main.py</code></p></div>`;
            }
        }

        async function fetchStats() {
            try {
                const resp = await fetch(`${API_URL}/stats`);
                const data = await resp.json();
                document.getElementById("statRemotive").textContent = data.sources.Remotive || 0;
                document.getElementById("statArbeitnow").textContent = data.sources.Arbeitnow || 0;
                document.getElementById("statRemoteOK").textContent = data.sources.RemoteOK || 0;
            } catch {}
        }

        // Modal
        function openModal(job) {
            document.getElementById("modalTitle").textContent = job.title;
            document.getElementById("modalCompany").textContent = job.company;
            document.getElementById("modalDesc").textContent = job.description;
            document.getElementById("modalApply").href = job.url;

            const meta = [];
            if (job.location) meta.push(`📍 ${job.location}`);
            if (job.salary) meta.push(`💰 ${job.salary}`);
            if (job.posted_date) meta.push(`📅 ${formatDate(job.posted_date)}`);
            meta.push(`<span class="job-source-badge ${badgeClass(job.source)}">${job.source}</span>`);
            document.getElementById("modalMeta").innerHTML = meta.join(" · ");

            const bm = document.getElementById("modalBookmark");
            bm.textContent = isBookmarked(job.id) ? "🔖 Saved" : "🔖 Save Job";
            bm.onclick = () => { toggleBookmark(job.id); bm.textContent = isBookmarked(job.id) ? "🔖 Saved" : "🔖 Save Job"; };

            document.getElementById("modalShare").onclick = () => {
                navigator.clipboard?.writeText(job.url);
                showToast("Link copied! 📋");
            };

            document.getElementById("modalOverlay").classList.add("open");
        }

        document.getElementById("modalClose").onclick = () => document.getElementById("modalOverlay").classList.remove("open");
        document.getElementById("modalOverlay").onclick = (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove("open"); };

        // Event listeners
        document.querySelectorAll(".category-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".category-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentCategory = btn.dataset.cat;
                document.getElementById("sectionTitle").textContent = categoryNames[currentCategory] || "All Jobs";
                fetchJobs();
            };
        });

        document.querySelectorAll(".source-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".source-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentSource = btn.dataset.source;
                fetchJobs();
            };
        });

        document.querySelectorAll(".tab-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentTab = btn.dataset.tab;
                const displayJobs = currentTab === "bookmarks" ? allJobs.filter(j => isBookmarked(j.id)) : allJobs;
                renderJobs(displayJobs);
            };
        });

        document.getElementById("sortSelect").onchange = (e) => { currentSort = e.target.value; fetchJobs(); };

        let searchTimeout;
        document.getElementById("searchInput").oninput = (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => { currentSearch = e.target.value.trim(); fetchJobs(); }, 400);
        };

        document.getElementById("loadMoreBtn").onclick = () => { currentPage++; fetchJobs(true); };

        document.getElementById("exportBtn").onclick = async () => {
            try {
                const params = new URLSearchParams();
                if (currentCategory !== "all") params.set("category", currentCategory);
                if (currentSearch) params.set("search", currentSearch);
                if (currentSource) params.set("source", currentSource);
                window.open(`${API_URL}/jobs/export?${params}&fmt=csv`, "_blank");
                showToast("Export started 📥");
            } catch { showToast("Export failed"); }
        };

        // Theme toggle
        const themeBtn = document.getElementById("themeToggle");
        const savedTheme = localStorage.getItem("jobhunt_theme") || "dark";
        if (savedTheme === "light") { document.documentElement.setAttribute("data-theme", "light"); themeBtn.textContent = "☀️"; }
        themeBtn.onclick = () => {
            const isLight = document.documentElement.getAttribute("data-theme") === "light";
            document.documentElement.setAttribute("data-theme", isLight ? "dark" : "light");
            themeBtn.textContent = isLight ? "🌙" : "☀️";
            localStorage.setItem("jobhunt_theme", isLight ? "dark" : "light");
        };

        // Init
        updateBookmarkCount();
        fetchStats();
        fetchJobs();
    </script>
</body>
</html>
